<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap');
      .brand-title { font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; font-size: 26px; fill: #0F2B48; letter-spacing: -0.02em; }
      .brand-tagline { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 700; font-size: 10px; fill: #2EA44F; letter-spacing: 0.16em; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Emblem Left (Scale and Translated) -->
  <g transform="translate(10, 5) scale(0.45)">
    <!-- Upper Arch - Rising Sun and Growth (Green) -->
    <path d="M 28,106 C 24,62 58,26 100,24 C 142,26 176,62 172,106" stroke="#2EA44F" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- Lower Arch - Corporate Foundation (Navy) -->
    <path d="M 28,110 C 32,154 66,186 100,186 C 134,186 168,154 172,110" stroke="#0F2B48" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Global Sphere -->
    <circle cx="100" cy="116" r="32" fill="#E8F2FA" stroke="#3E7CB1" stroke-width="2.5"/>
    <ellipse cx="100" cy="116" rx="32" ry="12" fill="none" stroke="#3E7CB1" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.6"/>
    <ellipse cx="100" cy="116" rx="16" ry="32" fill="none" stroke="#3E7CB1" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.6"/>
    <!-- Arched Suspension Bridge Structure -->
    <path d="M 24,108 Q 100,82 176,108" stroke="#0F2B48" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 68,102 C 72,130 128,130 132,102" stroke="#0F2B48" stroke-width="5" fill="none"/>
    <path d="M 32,107 C 36,124 64,124 68,104" stroke="#0F2B48" stroke-width="4" fill="none"/>
    <path d="M 132,104 C 136,124 164,124 168,107" stroke="#0F2B48" stroke-width="4" fill="none"/>
    <line x1="68" y1="102" x2="68" y2="135" stroke="#0F2B48" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="132" y1="102" x2="132" y2="135" stroke="#0F2B48" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Left Figure (Navy) -->
    <circle cx="76" cy="68" r="7.5" fill="#0F2B48"/>
    <path d="M 66,88 C 66,78 86,78 86,88 L 84,97 C 80,98 72,98 68,97 Z" fill="#0F2B48"/>
    <!-- Central Figure (Growth Green) -->
    <circle cx="100" cy="66" r="7.5" fill="#2EA44F"/>
    <path d="M 90,86 C 90,76 110,76 110,86 L 108,95 C 104,96 96,96 92,95 Z" fill="#2EA44F"/>
    <!-- Right Figure (Navy) -->
    <circle cx="124" cy="68" r="7.5" fill="#0F2B48"/>
    <path d="M 114,88 C 114,78 134,78 134,88 L 132,97 C 128,98 120,98 116,97 Z" fill="#0F2B48"/>
    <!-- Golden Opportunity Star -->
    <circle cx="100" cy="24" r="3.5" fill="#C9A45C"/>
  </g>

  <!-- Typography Right -->
  <text x="115" y="47" class="brand-title">TALENT BRIDGE</text>
  <text x="115" y="66" class="brand-title" style="font-weight: 500; font-size: 19px; fill: #3E7CB1; letter-spacing: 0.05em;">GLOBAL SOLUTIONS</text>
  <text x="116" y="84" class="brand-tagline">Connecting Talent • Bridging Success</text>
</svg>
